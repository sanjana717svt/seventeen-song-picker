<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SEVENTEEN Song Picker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>🎧 SEVENTEEN Song Picker</h1>

        <p class="subtitle">
            Don't know what to listen to? Let SEVENTEEN decide.
        </p>

        <section class="song-card" id="song-card">

            <p class="label">YOUR SONG IS...</p>

            <h2 id="song-title">Press the button 👀</h2>

            <p id="song-album">Something good is waiting for you.</p>
            <p id="song-mood">Mood: ✨</p>

            <p id="mood-message"></p>

            <div class="mood-buttons">

                <button class="mood-btn" data-mood="Comfort">
                    🩵 Comfort
                </button>

                <button class="mood-btn" data-mood="Happy">
                    🩷 Happy
                </button>

                <button class="mood-btn" data-mood="Hype">
                    🔥 Hype
                </button>

                <button class="mood-btn" data-mood="Emotional">
                    🌙 Emotional
                </button>

            </div>

            <button id="pick-song-btn">
                PICK A SONG
            </button>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
